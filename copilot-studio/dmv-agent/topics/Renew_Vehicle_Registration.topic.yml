kind: DialogComponent
managedProperties:
  isCustomizable: false

displayName: Renew Vehicle Registration
parentBotId: 16efd3d3-2543-f111-88b4-001dd801f94a
shareContext: {}
state: Active
status: Active
publisherUniqueName: DefaultPublisherorga381269e
schemaName: crd60_agent.topic.RenewVehicleRegistration
dialog:
  modelDescription: |-
    Use this topic when the user wants to renew their vehicle registration, pay registration fees, complete a vehicle registration renewal, or submit a renewal request.
    Examples: "renew my registration", "renew my vehicle", "renew my Tesla", "pay my registration fee", "complete my renewal", "start my renewal".
  beginDialog:
    kind: OnRecognizedIntent
    id: main
    intent: {}
    actions:
      - kind: ConditionGroup
        id: cg_haveEmail
        conditions:
          - id: cond_emailBlank
            condition: =IsBlank(Global.Email)
            actions:
              - kind: Question
                id: q_email
                interruptionPolicy:
                  allowInterruption: true
                variable: Global.Email
                prompt: To start your renewal, what's the email address on your Contoso DMV account?
                entity: EmailPrebuiltEntity
                alwaysPrompt: false

      - kind: ConditionGroup
        id: cg_haveRenewalVehicle
        conditions:
          - id: cond_renewalVehicleBlank
            condition: =IsBlank(Global.SelectedRenewalVehicle)
            actions:
              - kind: SetVariable
                id: setVariable_renewalVehicleOptions
                variable: init:Topic.RenewalVehicleOptions
                value: |-
                  =Table(
                    { DisplayName: "2024 Tesla Model S - REG-000002", VehicleName: "2024 Tesla Model S", RegistrationId: "REG-000002", VehicleId: "26def455-1d39-f111-88b4-001dd80340cd", Score: 1.0 },
                    { DisplayName: "2023 Honda Accord - REG-000001", VehicleName: "2023 Honda Accord", RegistrationId: "REG-000001", VehicleId: "03def455-1d39-f111-88b4-001dd80340cd", Score: 1.0 }
                  )

              - kind: Question
                id: question_selectRenewalVehicle
                interruptionPolicy:
                  allowInterruption: true
                variable: init:Topic.SelectedRenewalVehicle
                prompt: Which vehicle would you like to renew?
                entity:
                  kind: DynamicClosedListEntity
                  items: =Topic.RenewalVehicleOptions
                alwaysPrompt: true

              - kind: SetVariable
                id: setVariable_selectedRenewalVehicle
                variable: Global.SelectedRenewalVehicle
                value: =Topic.SelectedRenewalVehicle.VehicleName

              - kind: SetVariable
                id: setVariable_selectedRenewalVehicleId
                variable: Global.SelectedRenewalVehicleId
                value: =Topic.SelectedRenewalVehicle.VehicleId

      - kind: SendActivity
        id: sa_intro
        activity: |-
          I can help start the registration renewal for **{Global.SelectedRenewalVehicle}** for **{If(!IsBlank(Global.CustomerName), Global.CustomerName, If(Global.Email = "kellycason+maria@microsoft.com", "Maria Jennings", Global.Email))}**.

          The standard renewal fee is **$50.00**. Before submitting, please confirm your vehicle, insurance, and mailing address in the Contoso DMV portal if anything has changed.

      - kind: SetVariable
        id: setVariable_paymentMethodOptions
        variable: init:Topic.PaymentMethodOptions
        value: |-
          =Table(
            { DisplayName: "Credit Card", Value: "Credit Card", PayCode: "credit", Score: 1.0 },
            { DisplayName: "Debit Card", Value: "Debit Card", PayCode: "debit", Score: 1.0 },
            { DisplayName: "Cash", Value: "Cash", PayCode: "cash", Score: 1.0 }
          )

      - kind: Question
        id: q_paymentMethod
        interruptionPolicy:
          allowInterruption: true
        variable: init:Topic.paymentMethod
        prompt: How would you like to pay the $50 renewal fee?
        entity:
          kind: DynamicClosedListEntity
          items: =Topic.PaymentMethodOptions
        alwaysPrompt: true

      - kind: Question
        id: q_finalConfirm
        interruptionPolicy:
          allowInterruption: true
        variable: Topic.finalConfirm
        prompt: |-
          Just to confirm: should I prepare the renewal for **{Global.SelectedRenewalVehicle}** using **{Topic.paymentMethod.DisplayName}** as the payment method?
        entity: BooleanPrebuiltEntity
        alwaysPrompt: true

      - kind: ConditionGroup
        id: cg_finalConfirmed
        conditions:
          - id: cond_cancelled
            condition: =Topic.finalConfirm <> true
            actions:
              - kind: SendActivity
                id: sa_cancelled
                activity: |-
                  No problem. I have not submitted anything. You can complete the renewal anytime at the [Contoso DMV portal](https://site-y5jzr.powerappsportals.us/vehicle-registration).
              - kind: EndDialog
                id: ed_cancelled

      - kind: SendActivity
        id: sa_success
        activity: |-
          You're ready to finish the renewal for **{Global.SelectedRenewalVehicle}**.

          Open the secure portal checkout to review the pre-filled renewal and submit payment: [Continue renewal](https://site-y5jzr.powerappsportals.us/vehicle-registration?renew={Global.SelectedRenewalVehicleId}&step=payment&pay={Topic.paymentMethod.PayCode})

  inputType: {}
  outputType: {}